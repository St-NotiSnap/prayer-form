<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기도제목 결과</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>
<style>
  html, body { margin:0; padding:0; background:#0a1033; overflow:hidden; height:100%; }
  #viewport { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage {
    width:1920px; height:1080px; position:relative; background:#0a1033;
    font-family:'Noto Sans KR', sans-serif; color:#fff; flex-shrink:0;
  }
  .slide { position:absolute; top:0; left:0; width:1920px; height:1080px; display:none; }
  .slide.active { display:block; }
  .center { position:absolute; left:0; width:1920px; text-align:center; }
  #introTitle1 { top:210px; font-size:92px; font-weight:900; color:#FFD93D; line-height:1.3; }
  #introTitle2 { top:338px; font-size:92px; font-weight:900; color:#FFD93D; line-height:1.3; }
  #introCountRow { top:492px; display:flex; align-items:baseline; justify-content:center; gap:16px; }
  #introCount { font-size:150px; font-weight:900; color:#fff; }
  #introCountUnit { font-size:30px; font-weight:400; color:#B9C2E0; }
  #introLabel { top:700px; font-size:30px; font-weight:400; color:#B9C2E0; }
  #introEmpty { top:492px; font-size:34px; font-weight:700; color:#8E97BE; line-height:1.6; width:1920px; }
  #introSub { top:780px; font-size:34px; font-weight:700; color:#8E97BE; }
  #introFooter { top:970px; font-size:24px; font-weight:400; color:#5A6490; }
  .dot { position:absolute; border-radius:50%; }
  #cloudCanvas { position:absolute; left:110px; top:110px; width:1700px; height:860px; background:#0a1033; }
  #startOverlay {
    position:fixed; inset:0; background:#0a1033; color:#8E97BE; font-family:'Noto Sans KR', sans-serif;
    display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; z-index:999;
  }
</style>
</head>
<body>
  <div id="startOverlay">화면을 클릭하면 시작합니다</div>
  <div id="viewport">
    <div id="stage">
      <div class="slide active" id="slideIntro">
        <div class="center" id="introTitle1">자녀된 우리가 오늘,</div>
        <div class="center" id="introTitle2">아버지께 드릴 기도</div>
        <div class="center" id="introCountRow">
          <span id="introCount"></span><span id="introCountUnit">명의</span>
        </div>
        <div class="center" id="introLabel">마음이 모였습니다</div>
        <div class="center" id="introEmpty" style="display:none">아직 도착한<br>기도제목이 없습니다</div>
        <div class="center" id="introSub">성도님들이 남겨주신 익명의 기도제목입니다</div>
        <div class="center" id="introFooter">함께그린교회  ·  2026 DAY AND NIGHT</div>
      </div>
    </div>
  </div>

<script>
var PALETTE = ['#FFD93D','#FF4FA3','#2EE6D6','#FF8C42','#8CFF6B','#5EC8F2','#FFFFFF','#FF6B6B'];
var PER_PAGE = 30;
var stage = document.getElementById('stage');
var slideIntro = document.getElementById('slideIntro');
var slides = [];       // array of DOM elements, index 0 = intro
var current = 0;

function fitStage() {
  var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  stage.style.transform = 'scale(' + scale + ')';
}
window.addEventListener('resize', fitStage);

function addDots() {
  for (var i = 0; i < 14; i++) {
    var dot = document.createElement('div');
    dot.className = 'dot';
    var leftSide = Math.random() < 0.5;
    var x = leftSide ? (40 + Math.random() * 380) : (1500 + Math.random() * 380);
    var y = 80 + Math.random() * 920;
    var r = 3 + Math.random() * 3;
    dot.style.left = x + 'px'; dot.style.top = y + 'px';
    dot.style.width = (r * 2) + 'px'; dot.style.height = (r * 2) + 'px';
    dot.style.background = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    slideIntro.appendChild(dot);
  }
}

function splitEvenly(arr, maxPerPage) {
  var n = arr.length;
  if (n === 0) return [];
  var pages = Math.ceil(n / maxPerPage);
  var base = Math.floor(n / pages);
  var extra = n % pages;
  var result = []; var idx = 0;
  for (var p = 0; p < pages; p++) {
    var size = base + (p < extra ? 1 : 0);
    result.push(arr.slice(idx, idx + size));
    idx += size;
  }
  return result;
}

function buildCloudSlide(pagePhrases) {
  var slide = document.createElement('div');
  slide.className = 'slide';
  var canvas = document.createElement('canvas');
  canvas.id = 'cloudCanvas';
  canvas.width = 1700; canvas.height = 860;
  slide.appendChild(canvas);
  stage.appendChild(slide);
  var list = pagePhrases.map(function (p) { return [p, 40]; }); // 균일 크기
  // 문구가 적을수록 격자를 넓혀서 가운데에 뭉치지 않게 (14~90)
  var gridSize = Math.max(30, Math.min(90, Math.round(600 / pagePhrases.length)));
  WordCloud(canvas, {
    list: list,
    weightFactor: 1,
    fontFamily: "'Noto Sans KR', sans-serif",
    fontWeight: '700',
    color: function () { return PALETTE[Math.floor(Math.random() * PALETTE.length)]; },
    backgroundColor: '#0a1033',
    gridSize: gridSize,
    shrinkToFit: true,
    minSize: 12,
    rotateRatio: 0,
    drawOutOfBound: false,
    shuffle: true
  });
  return slide;
}

function render() {
  slides.forEach(function (s, i) { s.classList.toggle('active', i === current); });
}

function nextSlide() { if (current < slides.length - 1) { current++; render(); } }
function prevSlide() { if (current > 0) { current--; render(); } }

var EMPTY_MSG = '아직 도착한<br>기도제목이 없습니다';
var ERROR_MSG = '데이터를 불러오지 못했습니다<br>R 키를 눌러 다시 시도하세요';

function loadAndBuild() {
  fetch('/api/results').then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (data) {
    var phrases = (data.phrases || []).filter(function (p) {
      return typeof p === 'string' && p.trim().length >= 1 && p.trim().length <= 12;
    });
    // 웹폰트는 글자 범위별로 나눠 받으므로, 실제 문구에 쓰인 글자를 먼저 받아둔 뒤 그린다
    var fontLoad = phrases.length > 0
      ? document.fonts.load("700 40px 'Noto Sans KR'", phrases.join('')).catch(function () {})
      : Promise.resolve();
    return fontLoad.then(function () { return phrases; });
  }).then(function (phrases) {
    document.getElementById('introCount').textContent = phrases.length;
    document.getElementById('introLabel').style.display = phrases.length > 0 ? 'block' : 'none';
    document.getElementById('introCountRow').style.display = phrases.length > 0 ? 'flex' : 'none';
    document.getElementById('introEmpty').innerHTML = EMPTY_MSG;
    document.getElementById('introEmpty').style.display = phrases.length > 0 ? 'none' : 'block';

    // 기존 워드클라우드 슬라이드 제거 후 재생성
    slides.slice(1).forEach(function (s) { s.remove(); });
    slides = [slideIntro];
    var pages = splitEvenly(phrases, PER_PAGE);
    pages.forEach(function (page) { slides.push(buildCloudSlide(page)); });
    current = 0;
    render();
  }).catch(function (err) {
    console.error('[display] /api/results 불러오기 실패:', err);
    // 에러는 인트로 자리에서만 표시하고, 기존 워드클라우드 슬라이드는 그대로 유지
    if (slides.length === 0) slides = [slideIntro];
    document.getElementById('introCountRow').style.display = 'none';
    document.getElementById('introLabel').style.display = 'none';
    document.getElementById('introEmpty').innerHTML = ERROR_MSG;
    document.getElementById('introEmpty').style.display = 'block';
    current = 0;
    render();
  });
}

document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
  else if (e.key === 'ArrowLeft' || e.key === 'Backspace') prevSlide();
  else if (e.key === 'r' || e.key === 'R') loadAndBuild();
});

document.getElementById('startOverlay').addEventListener('click', function () {
  document.documentElement.requestFullscreen().catch(function () {});
  this.style.display = 'none';
  fitStage();
  addDots();
  document.fonts.ready.then(function () {
    loadAndBuild();
  });
});

fitStage();
</script>
</body>
</html>
